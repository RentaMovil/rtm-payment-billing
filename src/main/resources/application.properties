spring.application.name=rtm-payment-billing
server.port=${APP_PAYMENT_BILLING_PORT:3004}

# Carga las variables del archivo .env (solo en local)
spring.config.import=optional:file:.env[.properties]

# Base compartida rentamovil, con el usuario payment_app (nunca sa)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Las tablas las crea rtm-payment-billing-db (Liquibase). Hibernate solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=payment
# Las fechas se leen y escriben en UTC (ver PaymentBillingApplication)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Multipart no se usa: los archivos ya suben al navegador vía Cloudinary (payment-billing-plan);
# a este servicio solo le llega la URL en JSON.

# Seguridad: iam (su clave pública se descarga de GET /jwks y se refresca sola si iam rota su
# clave de firma; la privada nunca sale de rtm-iam)
app.payment-billing.iam-url=${IAM_URL:http://localhost:3001}

# booking-reservation: monto/estado de la reserva al pagar, y destino de los eventos que publica
# este servicio (PaymentSubmitted, PaymentCompleted, PaymentRejected, InvoiceGenerated)
app.payment-billing.booking-url=${BOOKING_URL:http://localhost:3003}
app.payment-billing.booking-timeout=${BOOKING_TIMEOUT:3s}

# Comprobantes y QR: solo se aceptan URLs de la cuenta de Cloudinary del frontend (mismo patrón
# que app.iam.profile-image.allowed-prefix en rtm-iam)
app.payment-billing.file.allowed-prefix=${APP_PAYMENT_BILLING_FILE_ALLOWED_PREFIX:https://res.cloudinary.com/dz6ohgjub/image/upload/}

# PDF de la factura: mientras no haya un api_secret de Cloudinary para subirlo del lado del
# servidor (cloudinary-account), se guarda en esta carpeta local y lo sirve el propio servicio.
app.payment-billing.invoice-storage.dir=${APP_PAYMENT_BILLING_INVOICE_STORAGE_DIR:./invoices-storage}

# Clave compartida que deben enviar los otros microservicios en el header X-Internal-Key para
# llamar a /internal/**. Misma clave en booking-reservation, fleet-maintenance, payment-billing
# y telemetry-gps.
app.internal.api-key=${APP_INTERNAL_API_KEY:}
